name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.27.3"
      GO_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
      # The runner's Docker daemon is shared, so everything this job makes is
      # named after the run and removed by name (docs/WORKFLOW.md, "Checks").
      NAME_PREFIX: foreman-ci-${{ github.run_id }}
      IMAGE: foreman-ci-${{ github.run_id }}-image:ci
      DOCKER_USER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install make and the Docker client
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make docker-cli gzip

      - name: Install Go
        run: |
          curl -fsSLo /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      - name: make ci
        run: make ci WORKSPACE="--volumes-from $(hostname)"

      - name: Image size
        run: docker save "$IMAGE" | gzip | wc -c

      - name: Clean up
        if: always()
        run: make ci-clean RUN=${{ github.run_id }}
