name: ci

# Pull requests into an epic branch run no CI: the orchestrator's local
# checks gate those merges, and CI runs on each push to the epic branch
# instead, so a CI-only failure shows up minutes after the merge behind it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

# A new push to a pull request or an epic branch cancels that ref's older
# run; the newer tree holds the older change too. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs run in parallel; together they are `make ci`. The `ci` job at the
# end is the one check the ruleset on main requires, so adding a job here
# needs no change to the ruleset.
jobs:
  # Decides whether verify, e2e and image run. They are skipped (code=false)
  # when a green run already tested this exact git tree, or when a pull
  # request changes only files nothing in the build, tests or CI reads.
  # Anything unexpected leaves code=true, a full run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      tree: ${{ steps.decide.outputs.tree }}
    steps:
      # Depth 2 holds the pull request's merge commit, or the pushed commit,
      # and its first parent: the base it is merged onto, or the branch's
      # previous head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          # A marker uploaded by a run for a fork's pull request is not trusted.
          if found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length'); then
            if [ "$found" -gt 0 ]; then
              echo "A green run already tested tree $tree; skipping the build and tests."
              echo "code=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Could not look up earlier runs of tree $tree; running everything."
          fi

          # A push to main runs in full unless its tree was already tested.
          if [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only --no-renames 'HEAD^1' HEAD)
          code=false
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              .github/*) code=true ;;
              docs/* | .claude/* | .githooks/* | *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          if [ "$code" = false ]; then
            echo "Only documentation and developer-machine files changed; skipping the build and tests."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Refuses a pull request whose commits, title or body credit an AI
  # assistant as co-author: GitHub lists every co-author as a contributor,
  # and a squash merge copies those lines onto main.
  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No AI co-author lines
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          # The merge commit's parents are the base and the pull request's head.
          for c in $(git rev-list 'HEAD^1..HEAD^2'); do
            if ! git log -1 --format=%B "$c" | .github/ai-trailer-check; then
              echo "::error::Commit $c ($(git log -1 --format=%s "$c")) credits an AI assistant as co-author. Reword it."
              status=1
            fi
          done
          if ! printf '%s\n%s\n' "$TITLE" "$BODY" | .github/ai-trailer-check; then
            echo "::error::The pull request's title or body credits an AI assistant as co-author. Edit it."
            status=1
          fi
          exit "$status"

  # `make verify`, split so its slow parts run side by side.
  verify:
    name: verify (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: vet
            run: make check-go fmt-check vet
          - check: lint
            run: make lint
          - check: test
            run: make test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go version from the Makefile
        id: go
        run: echo "version=$(sed -n 's/^GO_VERSION *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: go.sum

      # The lint container keeps its caches in .cache/.
      - if: matrix.check == 'lint'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-${{ hashFiles('go.sum', 'Makefile', '.golangci.yml') }}

      - run: ${{ matrix.run }}

  # The end-to-end tests, in four slices that run side by side. The check
  # names (e2e (1/4) and so on) are not required by the ruleset; the `ci`
  # job below waits for every slice.
  e2e:
    name: e2e (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go version from the Makefile
        id: go
        run: echo "version=$(sed -n 's/^GO_VERSION *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/npm
            e2e/node_modules
          key: e2e-${{ hashFiles('Makefile', 'e2e/package-lock.json') }}

      # The type check is part of `make verify`; it runs here because it
      # needs the same Playwright image and packages. One slice is enough.
      - if: matrix.shard == '1/4'
        run: make typecheck

      - run: make e2e SHARD=${{ matrix.shard }}

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the build image from the Makefile
        id: go
        run: echo "image=$(sed -n 's/^GO_IMAGE *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same build as `make image`, with layers cached between runs.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: GO_IMAGE=${{ steps.go.outputs.image }}
          tags: foreman:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size (SPEC 16.1)
        run: |
          size=$(docker save foreman:ci | gzip | wc -c)
          echo "Compressed image: $size bytes (limit 30000000)"
          [ "$size" -le 30000000 ]

  # The single required check. The build and test jobs may be skipped only
  # when `changes` passed and said code=false. After a full green run it
  # records the tested tree, so the same tree is not tested again.
  ci:
    if: always()
    needs: [changes, trailers, verify, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TRAILERS: ${{ needs.trailers.result }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "changes=$CHANGES code=$CODE trailers=$TRAILERS verify=$VERIFY e2e=$E2E image=$IMAGE"
          [ "$CHANGES" = success ]
          if [ "$EVENT" = pull_request ]; then
            [ "$TRAILERS" = success ]
          else
            [ "$TRAILERS" = skipped ]
          fi
          case "$CODE" in
            true) want=success ;;
            false) want=skipped ;;
            *) exit 1 ;;
          esac
          [ "$VERIFY" = "$want" ] && [ "$E2E" = "$want" ] && [ "$IMAGE" = "$want" ]

      - name: Record the tested tree
        if: needs.changes.outputs.code == 'true'
        run: echo "$GITHUB_SHA" > tested-tree

      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ needs.changes.outputs.tree }}
          path: tested-tree
          retention-days: 30
          overwrite: true
