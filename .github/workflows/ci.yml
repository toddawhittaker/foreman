name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      GO_VERSION: "1.27.3"
      GO_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
      # Everything this job makes is named after the run and removed by name,
      # and the job fails if anything is left (docs/WORKFLOW.md, "Checks").
      NAME_PREFIX: foreman-ci-${{ github.run_id }}
      IMAGE: foreman-ci-${{ github.run_id }}-image:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Go
        run: |
          curl -fsSLo /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf /tmp/go.tgz
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: make ci
        run: make ci

      - name: Image size
        run: |
          size=$(docker save "$IMAGE" | gzip | wc -c)
          echo "Compressed image: $size bytes (limit 30000000)"
          [ "$size" -le 30000000 ]

      - name: Clean up
        if: always()
        run: make ci-clean RUN=${{ github.run_id }}

      - name: Check nothing is left behind
        if: always()
        run: make ci-leftovers RUN=${{ github.run_id }}
