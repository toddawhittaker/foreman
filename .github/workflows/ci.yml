name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The three jobs run in parallel. Together they are `make ci`.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go version from the Makefile
        id: go
        run: echo "version=$(sed -n 's/^GO_VERSION *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: go.sum

      # The lint and type-check containers keep their caches in .cache/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache
            e2e/node_modules
          key: verify-${{ hashFiles('go.sum', 'Makefile', '.golangci.yml', 'e2e/package-lock.json') }}

      - run: make verify

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go version from the Makefile
        id: go
        run: echo "version=$(sed -n 's/^GO_VERSION *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/npm
            e2e/node_modules
          key: e2e-${{ hashFiles('Makefile', 'e2e/package-lock.json') }}

      - run: make e2e

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the build image from the Makefile
        id: go
        run: echo "image=$(sed -n 's/^GO_IMAGE *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same build as `make image`, with layers cached between runs.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: GO_IMAGE=${{ steps.go.outputs.image }}
          tags: foreman:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size (SPEC 16.1)
        run: |
          size=$(docker save foreman:ci | gzip | wc -c)
          echo "Compressed image: $size bytes (limit 30000000)"
          [ "$size" -le 30000000 ]
