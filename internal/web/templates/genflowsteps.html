{{/* The guided Generate's step bar: a list of links, the current step marked (SPEC 5.6, 17.10). Without script it is the way between the steps. Takes []FlowStep. */}}
{{define "genflow-steps" -}}
<nav class="subnav" aria-label="{{t "newmap.steps.label"}}" id="flow-steps">
  <ul role="list">
    {{- range .}}
    <li><a href="{{.Path}}"{{if .Current}} aria-current="step"{{end}}>{{msg .Label}}</a></li>
    {{- end}}
  </ul>
</nav>
{{- end}}
